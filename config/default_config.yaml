# StatArb Research Lab - default research configuration.
#
# Every research run saves a snapshot of the configuration it actually used
# (see reports/<run_id>/config_snapshot.yaml), together with the data source,
# retrieval timestamp and SHA-256 hashes of the raw input files.

data:
  source: synthetic            # yfinance | csv | synthetic
  asset_a: KO                  # dependent leg (log P_A is regressed on log P_B)
  asset_b: PEP
  # Candidate pairs for exploration only. They are NOT assumed to be cointegrated.
  candidate_pairs:
    - [HDFCBANK.NS, ICICIBANK.NS]
    - [TCS.NS, INFY.NS]
    - [KO, PEP]
  start_date: "2015-01-01"
  end_date: "2024-12-31"       # inclusive
  prefer_adjusted: true        # use 'Adj Close' when available, otherwise 'Close'
  cache_dir: data/raw
  min_observations: 252        # per asset, after cleaning
  max_gap_days: 7              # calendar-day gap that triggers a data-quality warning
  extreme_return_threshold: 0.25   # |daily log return| flagged as suspicious

splits:                        # chronological, no shuffling
  train: 0.6
  validation: 0.2
  test: 0.2

cointegration:
  significance: 0.05
  trend: c                     # constant in the cointegrating regression
  autolag: AIC                 # lag selection for the residual ADF regression
  min_observations: 100

hedge_ratio:
  method: ols_log_price        # log(P_A) = intercept + hedge_ratio * log(P_B) + residual

spread:
  min_std: 1.0e-8              # guard against a degenerate (near-constant) training spread

strategy:
  entry_z: 2.0
  exit_z: 0.5
  stop_loss_z: null            # disabled by default; e.g. 4.0
  max_holding_days: null       # disabled by default; e.g. 60
  execution_lag: 1             # signal at close t -> trade at close t+1 (must be >= 1)

portfolio:
  initial_capital: 1000000.0
  max_gross_exposure: 1.0      # |long notional| + |short notional| <= 1.0 x equity at entry
  rebalance_tolerance: 0.10    # rescale an open trade if gross leverage drifts >10% above the limit
  close_at_period_end: true    # liquidate open positions on the final bar of each evaluation period

costs:
  commission_bps: 5.0          # per leg, per side, on traded notional
  slippage_bps: 5.0            # per leg, per side, on traded notional
  borrow_bps_annual: 50.0      # annual fee on short notional, accrued daily
  short_selling_allowed: true  # explicit research assumption

metrics:
  periods_per_year: 252
  risk_free_rate: 0.0          # annual; converted to a daily geometric rate
  min_years_for_cagr: 1.0      # CAGR is reported as undefined for shorter periods

evaluation:
  # Which entry/exit thresholds are used on the final test period:
  #   config               -> the thresholds specified above (pre-registered)
  #   validation_selected  -> the best validation-period grid point (never the test period)
  test_parameter_source: config
  selection_metric: sharpe
  min_trades_for_selection: 3

walk_forward:
  train_window: 504            # ~2 years of daily bars used to fit each window
  test_window: 126             # ~6 months traded out-of-sample per window
  expanding: false             # false = rolling fit window; true = expanding fit window
  require_cointegration: true  # skip trading in windows whose fit period fails the EG test
  min_eval_observations: 20

robustness:
  entry_grid: [1.5, 2.0, 2.5, 3.0]
  exit_grid: [0.0, 0.25, 0.5, 1.0]
  cost_grid_bps: [0.0, 5.0, 10.0, 20.0, 40.0]   # combined commission + slippage per leg per side

synthetic:
  n_observations: 2520
  hedge_ratio: 0.8
  intercept: 0.4
  half_life: 15.0
  residual_volatility: 0.012
  seed: 42

reproducibility:
  random_seed: 42
  reports_dir: reports

ml:
  enabled: true
  # Target: y_t = 1 if |z_{t+H}| <= |z_t| - tolerance_z, else 0 (undefined when t+H is beyond the data).
  horizon: 5                   # H, trading sessions ahead
  tolerance_z: 0.25            # minimum fall in |z| that counts as meaningful mean reversion
  min_abs_z: 1.0               # samples (and ML-only entries) are restricted to |z_t| >= this
  embargo: 0                   # extra bars dropped at the end of each fit set, beyond the H-bar purge
  z_lags: [1, 2, 5]
  momentum_window: 10
  volatility_window: 20
  correlation_window: 20
  return_windows: [1, 5]
  probability_threshold: 0.5   # pre-specified threshold for the ML-only (B) and hybrid (C) variants
  threshold_source: config     # config | validation_selected (never the test period)
  threshold_grid: [0.5, 0.55, 0.6, 0.65, 0.7]
  tuning_metric: roc_auc       # hyperparameters chosen on validation: roc_auc | log_loss
  logistic_c_grid: [0.01, 0.1, 1.0, 10.0]
  rf_n_estimators: 200
  rf_max_depth_grid: [3, 6]
  rf_min_samples_leaf_grid: [10, 30]
  min_train_samples: 60        # fewer usable training rows -> the model is not fitted
  min_class_count: 10          # each class needs at least this many training rows
  min_eval_samples: 30         # fewer evaluation rows -> classification metrics reported as n/a
  calibration_bins: 5
